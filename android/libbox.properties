# libbox (sing-box core for Android) consumed by android/build.gradle.kts.
#
# The AAR is ~85 MB and is not shipped in the pub package. Gradle resolves it in
# this order:
#   1. Gradle property `singBox.libboxAar` or env `SING_BOX_LIBBOX_AAR` (path to a local AAR)
#   2. `android/libs/libbox.aar` inside the plugin directory (local development copy)
#   3. Download of `<baseUrl>/<fileName>` into
#      `<gradleUserHome>/caches/sing_box/libbox/<version>/`, verified with `sha256`.
#      The base URL can be overridden with the Gradle property `singBox.libboxBaseUrl`
#      or the env `SING_BOX_LIBBOX_BASE_URL`.
#
# `{version}` is replaced with `version` in `baseUrl` and `fileName`.
# The release script bumps `version` and `sha256` together.
version=1.14.4
sha256=d5511581e6275f10683f57bc8e7263badfa48c720d5d04acc741549fe6a66bae
baseUrl=https://github.com/QUSAD-prod/sing_box/releases/download/libbox-v{version}
fileName=libbox.aar
