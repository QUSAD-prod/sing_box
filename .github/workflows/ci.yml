name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The config tests run `sing-box check` on every generated config when
      # SING_BOX_BIN points to the CLI of the libbox version in use.
      - uses: actions/cache@v6
        id: sing-box-cli
        with:
          path: ~/.cache/sing-box-cli
          key: sing-box-cli-${{ hashFiles('LIBBOX_VERSION') }}
      - uses: actions/setup-go@v7
        if: steps.sing-box-cli.outputs.cache-hit != 'true'
        with:
          go-version: '1.25'
          cache: false
      - name: Build the sing-box CLI
        if: steps.sing-box-cli.outputs.cache-hit != 'true'
        run: |
          version="$(tr -d '[:space:]' < LIBBOX_VERSION)"
          mkdir -p ~/.cache/sing-box-cli
          git clone --quiet --depth 1 --branch "v$version" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          cd "$RUNNER_TEMP/sing-box"
          go build -trimpath -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api \
            -o ~/.cache/sing-box-cli/sing-box ./cmd/sing-box
      - run: echo "SING_BOX_BIN=$HOME/.cache/sing-box-cli/sing-box" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter pub publish --dry-run

  # The native builds download libbox from the `libbox-v<version>` GitHub
  # release. Check that it is published and matches the pinned checksums
  # first, so a missing release fails here in seconds with a clear message
  # instead of in three platform builds (see doc/releasing.md, step 3).
  libbox:
    name: libbox release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/verify_libbox_release.sh

  android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    needs: [dart, libbox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/sing_box
          key: libbox-android-${{ hashFiles('android/libbox.properties') }}
      - name: Build APK (libbox is downloaded from the GitHub release)
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build example (iOS, ${{ matrix.mode }})
    runs-on: macos-latest
    needs: [dart, libbox]
    strategy:
      fail-fast: false
      matrix:
        mode: [spm, cocoapods]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select package manager
        run: |
          if [ "${{ matrix.mode }}" = "spm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/sing_box
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: libbox-ios-${{ matrix.mode }}-${{ hashFiles('ios/sing_box/Package.swift') }}
      - name: Build for the simulator
        working-directory: example
        run: flutter build ios --simulator --debug

  # Builds a fresh app made by the oldest supported Flutter (keep the version
  # in sync with `environment.flutter` in pubspec.yaml). Such apps use AGP 8
  # with the Kotlin Android plugin 1.8, minSdk 21, iOS 12 and CocoaPods unless
  # Swift Package Manager is enabled, unlike the example app.
  minimum-flutter:
    name: Minimum Flutter (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [dart, libbox]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: ios-cocoapods
            os: macos-latest
          - target: ios-spm
            os: macos-latest
    env:
      MIN_FLUTTER: '3.29.3'
    steps:
      - uses: actions/checkout@v7
        with:
          path: sing_box
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.MIN_FLUTTER }}
          channel: stable
          cache: true
      - name: Select package manager
        if: startsWith(matrix.target, 'ios')
        run: |
          if [ "${{ matrix.target }}" = "ios-spm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi
      - name: Create an app that uses the plugin
        run: |
          platform="${{ matrix.target }}"
          flutter create --org com.example --platforms "${platform%%-*}" min_app
          cd min_app
          flutter pub add 'sing_box:{"path":"../sing_box"}'
          # Reference the plugin so its Dart code is compiled as well.
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:sing_box/sing_box.dart';

          void main() {
            final servers = SingBoxShareLink.parseSubscription(
              'trojan://secret@198.51.100.4:443#Server',
            );
            final config = const SingBoxConfigBuilder().build([
              for (final server in servers) server.json,
            ]);
            runApp(
              MaterialApp(
                home: Text('${config.length} ${SingBox.instance.status.name}'),
              ),
            );
          }
          DART
      - name: Raise the minimum OS versions to the plugin's
        working-directory: min_app
        run: |
          if [ "${{ matrix.target }}" = "android" ]; then
            sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle*
            grep -q 'minSdk = 24' android/app/build.gradle*
          else
            sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' ios/Runner.xcodeproj/project.pbxproj
            grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' ios/Runner.xcodeproj/project.pbxproj
          fi
      - uses: actions/cache@v6
        if: matrix.target == 'android'
        with:
          path: ~/.gradle/caches/sing_box
          key: libbox-android-${{ hashFiles('sing_box/android/libbox.properties') }}
      - uses: actions/cache@v6
        if: startsWith(matrix.target, 'ios')
        with:
          path: |
            ~/Library/Caches/sing_box
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: libbox-ios-min-${{ matrix.target }}-${{ hashFiles('sing_box/ios/sing_box/Package.swift') }}
      - name: Build
        working-directory: min_app
        run: |
          if [ "${{ matrix.target }}" = "android" ]; then
            flutter build apk --debug
          else
            flutter build ios --simulator --debug
          fi
