name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter pub publish --dry-run

  android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/sing_box
          key: libbox-android-${{ hashFiles('android/libbox.properties') }}
      - name: Build APK (libbox is downloaded from the GitHub release)
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build example (iOS, ${{ matrix.mode }})
    runs-on: macos-latest
    needs: dart
    strategy:
      fail-fast: false
      matrix:
        mode: [spm, cocoapods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select package manager
        run: |
          if [ "${{ matrix.mode }}" = "spm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sing_box
          key: libbox-ios-${{ hashFiles('ios/sing_box/Package.swift') }}
      - name: Build for the simulator
        working-directory: example
        run: flutter build ios --simulator --debug
