name: libbox

# Builds the sing-box native libraries. Pushing a tag `libbox-v<version>`
# (matching LIBBOX_VERSION) publishes them as release assets, which the
# plugin downloads at build time.

on:
  workflow_dispatch:
  push:
    tags: ['libbox-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build libbox
        run: scripts/build_libbox.sh android apple
      - name: Update checksums
        run: scripts/release_libbox.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: |
            build/libbox/libbox.aar
            build/libbox/Libbox.xcframework.zip
            build/libbox/*.sha256
            android/libbox.properties
            ios/sing_box/Package.swift
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/libbox-v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/release_libbox.sh --publish
