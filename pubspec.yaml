name: sing_box
description: >-
  Flutter VPN plugin powered by the sing-box core: VLESS, VMess, Trojan,
  Shadowsocks, Hysteria2, TUIC, WireGuard, routing rules, stats and speed tests.
version: 1.0.1
homepage: https://github.com/QUSAD-prod/sing_box
repository: https://github.com/QUSAD-prod/sing_box
issue_tracker: https://github.com/QUSAD-prod/sing_box/issues
documentation: https://github.com/QUSAD-prod/sing_box#readme
topics:
  - vpn
  - proxy
  - sing-box
  - vless
  - network

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.qusadprod.sing_box
        pluginClass: SingBoxPlugin
      ios:
        pluginClass: SingBoxPlugin
